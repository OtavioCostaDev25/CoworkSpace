services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coworkspace
      POSTGRES_USER: coworkspace
      POSTGRES_PASSWORD: coworkspace
    ports:
      - "5432:5432"
    volumes:
      - coworkspace-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - coworkspace-redis:/data

volumes:
  coworkspace-postgres:
  coworkspace-redis:
